# 改进的轻量级 YOLOv8n，复现论文 1.2/1.3 节结构 (对应论文图2)
# 相较原始 yolov8.yaml 的三处改动：
#   1) 骨干网络中全部4个下采样 Conv -> SCDown (1.3.2节，逐点卷积+深度卷积解耦下采样)
#   2) 三个检测尺度 (P3/P4/P5) 各自的输出特征后插入 SEAM 注意力 (1.3.1节)
#   3) 检测头 Detect -> RepHead (1.3.3节，共享RepConv主干 + 轻量1x1 cls/reg分支)

nc: 1 # 类别数：本任务仅检测“鸡头”单一类别
scales:
  n: [0.33, 0.25, 1024] # YOLOv8n 缩放系数，与论文一致(以YOLOv8n为基线)

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2 (stem，保留标准卷积)
  - [-1, 1, SCDown, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, SCDown, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, SCDown, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, SCDown, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 10
  - [[-1, 6], 1, Concat, [1]] # 11 cat backbone P4
  - [-1, 3, C2f, [512]] # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 13
  - [[-1, 4], 1, Concat, [1]] # 14 cat backbone P3
  - [-1, 3, C2f, [256]] # 15 (P3/8-small, 原始特征)
  - [-1, 1, SEAM, [256]] # 16 P3 SEAM 注意力增强

  - [-1, 1, Conv, [256, 3, 2]] # 17
  - [[-1, 12], 1, Concat, [1]] # 18 cat head P4
  - [-1, 3, C2f, [512]] # 19 (P4/16-medium, 原始特征)
  - [-1, 1, SEAM, [512]] # 20 P4 SEAM 注意力增强

  - [-1, 1, Conv, [512, 3, 2]] # 21
  - [[-1, 9], 1, Concat, [1]] # 22 cat head P5
  - [-1, 3, C2f, [1024]] # 23 (P5/32-large, 原始特征)
  - [-1, 1, SEAM, [1024]] # 24 P5 SEAM 注意力增强

  - [[16, 20, 24], 1, RepHead, [nc]] # 25 RepHead(P3, P4, P5)
